<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conectá tu WhatsApp</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      padding: 2rem;
    }

    .card {
      width: 100%;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .icon {
      width: 52px;
      height: 52px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon svg {
      width: 28px;
      height: 28px;
      fill: #2e7d32;
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #111;
      text-align: center;
      line-height: 1.3;
    }

    .qr-wrap {
      width: 220px;
      height: 220px;
      border-radius: 16px;
      border: 2px solid #e8f5e9;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .qr-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }

    .spinner-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 2.5px solid #e8f5e9;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .spinner-label {
      font-size: 12px;
      color: #aaa;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #666;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #2e7d32;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    .steps {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid #f0f0f0;
      padding-top: 1.25rem;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: #555;
      line-height: 1.5;
    }

    .step-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #e8f5e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: #2e7d32;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      color: #888;
      font-size: 12px;
      padding: 7px 16px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .refresh-btn:hover { border-color: #2e7d32; color: #2e7d32; }

    .error {
      font-size: 12px;
      color: #c62828;
      text-align: center;
    }

    .connected-msg {
      font-size: 15px;
      font-weight: 500;
      color: #2e7d32;
      text-align: center;
    }

    .brand {
      margin-top: 0.5rem;
      font-size: 11px;
      color: #ccc;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="icon">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
    </div>

    <h1>Conectá tu WhatsApp</h1>

    <div class="qr-wrap" id="qr-wrap">
      <div class="spinner-wrap" id="spinner">
        <div class="spinner"></div>
        <span class="spinner-label">Generando QR...</span>
      </div>
      <img id="qr-img" style="display:none;" alt="Código QR" />
    </div>

    <div class="status" id="status">
      <div class="dot"></div>
      <span id="status-text">Esperando escaneo...</span>
    </div>

    <div class="error" id="error" style="display:none;"></div>

    <button class="refresh-btn" onclick="loadQR()">Actualizar QR</button>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <span>Abrí WhatsApp en tu celular</span>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <span>Tocá los tres puntos → Dispositivos vinculados → Vincular dispositivo</span>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <span>Apuntá la cámara al código QR de arriba</span>
      </div>
    </div>

    <span class="brand">powered by quantum</span>

  </div>

  <script>
    const EVOLUTION_URL = 'https://n8n-evolution-api.oegkew.easypanel.host';
    const INSTANCE = 'Do It Fitness Club';
    const API_KEY = '038264AB9228-4175-9D1E-400BB760E3B4';

    async function loadQR() {
      const spinner = document.getElementById('spinner');
      const img = document.getElementById('qr-img');
      const error = document.getElementById('error');
      const statusText = document.getElementById('status-text');
      const qrWrap = document.getElementById('qr-wrap');

      spinner.style.display = 'flex';
      img.style.display = 'none';
      error.style.display = 'none';
      statusText.textContent = 'Generando QR...';

      try {
        const res = await fetch(
          `${EVOLUTION_URL}/instance/connect/${encodeURIComponent(INSTANCE)}`,
          { headers: { apikey: API_KEY } }
        );
        const data = await res.json();

        if (data.base64) {
          img.src = data.base64;
          img.style.display = 'block';
          spinner.style.display = 'none';
          statusText.textContent = 'Esperando escaneo...';
        } else if (data.instance?.state === 'open') {
          spinner.style.display = 'none';
          qrWrap.innerHTML = '<p class="connected-msg">WhatsApp conectado</p>';
          statusText.textContent = 'Conectado correctamente';
        } else {
          throw new Error('sin QR');
        }
      } catch {
        spinner.style.display = 'none';
        error.textContent = 'No se pudo cargar el QR. Tocá "Actualizar QR".';
        error.style.display = 'block';
        statusText.textContent = 'Error al conectar';
      }
    }

    loadQR();
    setInterval(loadQR, 30000);
  </script>

</body>
</html>
